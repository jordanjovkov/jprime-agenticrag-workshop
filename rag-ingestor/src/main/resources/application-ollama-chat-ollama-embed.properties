# ------------ AI Models Configuration 4 ------------------------------------------------

# Ollama Configuration if only it is used

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=all-minilm
spring.ai.ollama.embedding.options.num-batch=2048


# Disable Chat and Embedding autoconfiguration, we will configure them manually in Configuration classes
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

