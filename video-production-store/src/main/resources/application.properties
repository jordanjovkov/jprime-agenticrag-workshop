# =================================================================
# Application Identity
# =================================================================
spring.application.name=video-production-store


# =================================================================
# Server Configuration
# =================================================================
server.port=8080
server.servlet.context-path=/video-production-store
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# =================================================================
# Infrastructure (Docker Compose)
# =================================================================
spring.docker.compose.file=./video-production-store/docker/docker-compose.yml
spring.docker.compose.profiles.active=videoproductionstore


# =================================================================
# Database Configuration (MySQL)
# =================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/store_db
spring.datasource.username=store_user
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:mysql://${DB_HOST:localhost}:3306/store_db
spring.flyway.user=store_user
spring.flyway.password=secret


# =================================================================
# API Documentation (Swagger)
# =================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
