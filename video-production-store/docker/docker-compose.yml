name: agenticrag-${PROJECT_REVISION}

services:

  mysql:
    image: 'mysql:9.7'
    container_name: agenticrag-${PROJECT_REVISION}-mysql
    networks:
      - store-network
    environment:
      - 'MYSQL_DATABASE=store_db'
      - 'MYSQL_USER=store_user'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=secret'
    profiles:
      - videoproductionstore
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "store_user", "-psecret" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  store-network:
    driver: bridge

volumes:
  mysql-data:
