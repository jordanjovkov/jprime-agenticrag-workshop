# =================================================================
# Application Identity
# =================================================================
spring.application.name=@project.artifactId@
spring.profiles.active=cors-allow-only-local


# =================================================================
# Server Configuration
# =================================================================
server.port=8083
server.shutdown=graceful


# =================================================================
# MCP Server Configuration
# =================================================================
spring.ai.mcp.server.name=@project.artifactId@
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages


# =================================================================
# CORS Configuration
# =================================================================
spring.mvc.cors.mappings.[/**].allowed-origins=http://localhost:8082,http://localhost:6274,http://localhost:6277
spring.mvc.cors.mappings.[/**].allowed-methods=GET,POST
spring.mvc.cors.mappings.[/**].allowed-headers=Content-Type,Authorization


# =================================================================
# External Services
# =================================================================
app.video-production-store.base-url=http://localhost:8080/video-production-store/api


# =================================================================
# Observability
# =================================================================
management.endpoints.web.exposure.include=health, info


# =================================================================
# Logging
# =================================================================
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
